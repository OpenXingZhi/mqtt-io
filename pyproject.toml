[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mqtt-io"
version = "2.6.0"
description = "Expose GPIO modules (Raspberry Pi, Beaglebone, PCF8754, PiFace2 etc.), digital sensors (LM75 etc.) and serial streams to an MQTT server for remote control and monitoring."
authors = [{ name = "Ellis Percival", email = "mqtt-io@failcode.co.uk" }]
requires-python = "~=3.8"
readme = "README.md"
license = "MIT"
dependencies = [
    "PyYAML>=6.0.1,<7",
    "Cerberus>=1.3.2,<2",
    "typing-extensions>=4.4.0,<5",
    "dataclasses>=0.8,<0.9 ; python_version >= '3.6' and python_version < '3.7'",
    "aiomqtt>=2.1.0,<3",
    "backoff>=2.2.1,<3",
    "confp>=0.4.0,<0.5",
    "docutils==0.18.1",
    "markupsafe==2.0.1",
    "pyusb>=1.2.1,<2",
    "hidapi>=0.14.0,<0.15",
]

[project.urls]
Documentation = "https://flyte.github.io/mqtt-io/"

[dependency-groups]
dev = [
    "mock>=4.0.3,<5",
    "pytest>=6.2.2,<7",
    "tox>=3.22.0,<4",
    "pylint>=3.2.7,<4",
    "mypy>=1.11.2,<2",
    "behave>=1.2.6,<2",
    "coverage~=5.4",
    "md-toc>=8.0.0,<9",
    "Sphinx>=3.5.1,<4",
    "sphinx-autoapi>=1.7.0,<2",
    "recommonmark>=0.7.1,<0.8",
    "Jinja2>=3.1.3,<4",
    "ast-to-xml>=0.2.3,<0.3",
    "GitPython>=3.1.15,<4",
    "semver>=2.13.0,<3",
    "docutils==0.18.1",
]
